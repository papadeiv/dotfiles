# Colours: cyberdream palette
#   grey    #7b8496  (OS)            purple  #bd5eff  (user)
#   magenta #ff5ef1  (directory)     blue    #5ea1ff  (git)
#   yellow  #f1ff5e  (languages)     cyan    #5ef1ff  (battery)
#   text on the coloured segments: cyberdream background #16181a

# LEFT PROMPT
format = """
[](#7b8496)\
$os\
[](bg:#bd5eff fg:#7b8496)\
$username\
[](bg:#ff5ef1 fg:#bd5eff)\
$directory\
[](fg:#ff5ef1 bg:#5ea1ff)\
$git_branch\
$git_status\
[](bg:#f1ff5e fg:#5ea1ff)\
$c\
$cmake\
$python\
$julia\
[](fg:#f1ff5e bg:#5ef1ff)\
$battery\
[ ](fg:#5ef1ff)
[  └─ .𖥔 ݁🪐 ˖ 🛸 .✦ ➤ ](bold white)
"""
# [  └─ .𖥔 ݁ ˖🛸── .✦ ➤ ](bold white)
# [  └─ 🌑🌒🌓🌕 ](bold white)
# [  └─ ↟↟𓂃 ོ ☼𓂃↟ 𖠰𓂃 ོ𓂃 ](bold white)
add_newline = false 

# OS 
[os]
disabled = false
style = "bold bg:#7b8496 fg:#ffffff"

[os.symbols]
Arch = "🐧"

# Conda
[conda]
ignore_base = false
style = "bold bg:#1e2124 fg:#ffffff"
symbol = "🐍"
format = "[$symbol $environment]($style)"

# Username
[username]
show_always = true
style_user = "bold bg:#bd5eff fg:#16181a"
format = "[ $user ]($style)"

# Path
[directory]
truncation_length = 1
home_symbol = " "
style = "bold bg:#ff5ef1 fg:#16181a"
format = "[ $path]($style)"

[directory.substitutions]
"Downloads" = " " 
"Notes" = " "  
"Libraries" = " " 

# Git
[git_branch]
always_show_remote = true
symbol = "  "
style = "bold bg:#5ea1ff fg:#16181a"
format = "[ $symbol$branch(:$remote_branch) ]($style)"

[git_status]
style = "bold bg:#5ea1ff fg:#16181a"
up_to_date = '✓'
staged = '++${$count}'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
format = '[\[$all_status$ahead_behind\] ]($style)'

# C++
[c]
symbol = " "
style = "bg:#f1ff5e fg:#16181a"
format = '[ $symbol ($version) ]($style)'

# CMake
[cmake]
symbol = "△ "
style = "bg:#f1ff5e fg:#16181a"
format = '[ $symbol ($version) ]($style)'

# Python 
[python]
symbol = " "
style = "bg:#f1ff5e fg:#16181a"
format = '[ $symbol ($version) ]($style)'

# Julia 
[julia]
symbol = " "
style = "bg:#f1ff5e fg:#16181a"
format = '[ $symbol ($version) ]($style)'

#Battery
[battery]
full_symbol = "  "
charging_symbol = "  "
discharging_symbol = "  "
format = "[$symbol$percentage]($style)"

[[battery.display]]
threshold = 99 
style = "bg:#5ef1ff fg:#16181a"
